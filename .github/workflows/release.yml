# タグを打つと配布物を作って Releases に添付する。
#
#   git tag v1.0.0
#   git push origin v1.0.0
#
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: publish
        run: dotnet publish -c Release -o app

      - name: zip
        run: Compress-Archive -Path app\* -DestinationPath ArchClock.zip
        shell: pwsh

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          files: ArchClock.zip
          generate_release_notes: true
